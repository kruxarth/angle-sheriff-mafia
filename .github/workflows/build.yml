name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      # Writes the debug APK to a GitHub release on pushes to main.
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v6

      - name: Tests, APKs and lint
        run: |
          set +e
          ./gradlew --no-daemon :engine:test :lan:test :app:assembleDebug :app:assembleRelease :app:lintDebug 2>&1 | tee build.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            # Surface the useful lines as annotations, which stay readable through the checks API.
            grep -E -A2 "^e: |What went wrong|^> |error:|Error:|FAILED" build.log | grep -v "^--" | head -90 > errors.txt
            split -l 6 errors.txt chunk_
            for f in chunk_*; do
              msg=$(sed ':a;N;$!ba;s/%/%25/g;s/\n/%0A/g' "$f")
              echo "::error title=Gradle::$msg"
            done
          fi
          exit $status

      - name: Report lint warnings
        if: always()
        run: |
          f=app/build/reports/lint-results-debug.xml
          [ -f "$f" ] || exit 0
          python3 - "$f" <<'PY'
          import sys, xml.etree.ElementTree as ET
          issues = ET.parse(sys.argv[1]).getroot().findall("issue")
          print(f"{len(issues)} lint issues")
          for i in issues[:40]:
              loc = i.find("location")
              file = loc.get("file", "").split("/app/")[-1] if loc is not None else ""
              line = loc.get("line", "1") if loc is not None else "1"
              msg = f"[{i.get('id')}] {i.get('message')}".replace("%", "%25").replace("\n", " ")
              print(f"::warning file=app/{file},line={line},title=Lint {i.get('severity')}::{msg}")
          PY

      - uses: actions/upload-artifact@v7
        with:
          name: angel-sheriff-mafia-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: reports
          path: |
            build.log
            engine/build/reports
            lan/build/reports
            app/build/reports

      # Each push to main puts its debug APK on the release for its version, v<version>-debug,
      # so the newest build of a version replaces the older one and a new version gets a new release.
      - name: Publish the debug APK as a release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' app/build.gradle.kts)
          [ -n "$version" ] || { echo "::error title=Release::No versionName in app/build.gradle.kts"; exit 1; }
          tag="v${version}-debug"
          apk="app/build/outputs/apk/debug/app-debug.apk#angel-sheriff-mafia-${version}-debug.apk"
          notes="Debug build of ${version} (commit ${GITHUB_SHA::7}) for sideloading."
          if gh release view "$tag" >/dev/null 2>&1; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/$tag" -f sha="$GITHUB_SHA" -F force=true >/dev/null
            gh release upload "$tag" "$apk" --clobber
            gh release edit "$tag" --notes "$notes"
          else
            gh release create "$tag" "$apk" --title "v${version} (debug build)" --notes "$notes" \
              --prerelease --target "$GITHUB_SHA"
          fi
          echo "Published $tag: $(gh release view "$tag" --json url --jq .url)"
