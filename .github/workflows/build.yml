name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v6

      - name: Engine tests, APKs and lint
        run: |
          set +e
          ./gradlew --no-daemon :engine:test :app:assembleDebug :app:assembleRelease :app:lintDebug 2>&1 | tee build.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            # Surface the useful lines as annotations, which stay readable through the checks API.
            grep -E -A2 "^e: |What went wrong|^> |error:|Error:|FAILED" build.log | grep -v "^--" | head -90 > errors.txt
            split -l 6 errors.txt chunk_
            for f in chunk_*; do
              msg=$(sed ':a;N;$!ba;s/%/%25/g;s/\n/%0A/g' "$f")
              echo "::error title=Gradle::$msg"
            done
          fi
          exit $status

      - uses: actions/upload-artifact@v7
        with:
          name: angel-sheriff-mafia-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: reports
          path: |
            build.log
            engine/build/reports
            app/build/reports
